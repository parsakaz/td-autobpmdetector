[project]
name = "tdautobpm"
version = "0.1.0"
description = "Real-time BPM detection for TouchDesigner, powered by a causal TCN (TempoNet)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "parsakaz" }]
# Upstream model and weights by shhhum (https://github.com/shhhum/tdautobpmsync) - see NOTICE.

# Deliberately minimal. The upstream requirements.txt was a 35-line `pip freeze` in which
# ~20 packages (librosa, numba, llvmlite, scikit-learn, scipy, pooch, audioread, soxr,
# joblib, msgpack, ...) are never imported by the model or inference code, and which pinned
# `pip` and `setuptools` themselves - fighting the installer mid-install. That is what made
# environment creation fail. These 4 are what the engine actually imports.
dependencies = [
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Live capture from a system audio device, for `tdautobpm listen`. Not needed inside
# TouchDesigner, which supplies its own audio.
live = ["sounddevice>=0.4.6"]
dev = ["pytest>=7.4"]

[project.scripts]
tdautobpm = "tdautobpm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdautobpm"]

[tool.hatch.build.targets.wheel.force-include]
"models/temponet_ckpt.pt" = "tdautobpm/_models/temponet_ckpt.pt"

[tool.pytest.ini_options]
testpaths = ["tests"]
