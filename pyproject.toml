[project]
name = "tdautobpm"
version = "0.1.0"
description = "Real-time BPM detection for TouchDesigner, with a control panel, tap tempo and genre-aware tempo ranges"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "parsakaz" }]
keywords = ["touchdesigner", "bpm", "tempo", "beat", "audio", "vj"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Artistic Software",
]
# The TempoNet model and weights are shhhum's (https://github.com/shhhum/tdautobpmsync)
# and are not covered by this project's licence; see the README's Credits.

# The four packages the engine actually imports, and nothing else.
dependencies = [
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Live capture from a system audio device, for `tdautobpm listen`. Not needed inside
# TouchDesigner, which supplies its own audio.
live = ["sounddevice>=0.4.6"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/parsakaz/td-autobpmdetector"
Issues = "https://github.com/parsakaz/td-autobpmdetector/issues"

[project.scripts]
tdautobpm = "tdautobpm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdautobpm"]

[tool.hatch.build.targets.wheel.force-include]
"models/temponet_ckpt.pt" = "tdautobpm/_models/temponet_ckpt.pt"

[tool.pytest.ini_options]
testpaths = ["tests"]
